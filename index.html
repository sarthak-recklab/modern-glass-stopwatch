<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="A sleek modern glassmorphism stopwatch built with HTML, CSS, and Vanilla JS">
<title>Modern Glass Stopwatch</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
  <section class="stopwatch glass" aria-label="Stopwatch">
    <header class="stopwatch__head">
      <h1 class="stopwatch__title">Glass Stopwatch</h1>
      <p class="stopwatch__subtitle">Precision timing, beautifully simple</p>
    </header>
    <div class="display" role="timer" aria-live="polite">
      <span class="display__time" id="display">00:00:00</span>
      <span class="display__ms" id="displayMs">.00</span>
    </div>
    <div class="controls">
      <button class="btn btn--primary" id="startBtn" type="button">Start</button>
      <button class="btn btn--pause" id="pauseBtn" type="button" disabled>Pause</button>
      <button class="btn btn--lap" id="lapBtn" type="button" disabled>Lap</button>
      <button class="btn btn--reset" id="resetBtn" type="button">Reset</button>
    </div>
  </section>
  <section class="laps glass" aria-label="Lap records">
    <h2 class="laps__title">Lap Records</h2>
    <ul class="laps__list" id="lapList"></ul>
    <p class="laps__empty" id="lapEmpty">No laps recorded yet.</p>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
